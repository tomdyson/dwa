<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Items to review</title>
<link rel="stylesheet" href="app.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="_dwa.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<style>
  :root { --copper-light: #FAF5EE; --terracotta: #E76F51; --emerald: #2A9D8F; --mustard-dark: #C99B2F; --ink: #2B2B2B; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background-color: var(--copper-light);
         background-image: repeating-linear-gradient(135deg, rgba(231,111,81,0.045) 0 2px, transparent 2px 18px); }
  .serif { font-family: 'Gowun Batang', serif; letter-spacing: -0.01em; }
  .card { background: white; border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -8px rgba(0,0,0,.08); }
  [x-cloak] { display: none !important; }
</style>
</head>
<body x-data="review" class="min-h-screen">
<main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">
  <header class="mb-6">
    <p class="text-sm text-stone-500">Client name · Month 2026</p>
    <h1 class="serif mt-1 text-3xl sm:text-4xl">Items to review</h1>
    <p class="mt-3 max-w-2xl text-stone-600">What each row is, what we suggest, and what we need: approve it, query it, or say what should change.</p>
  </header>

  <p x-cloak x-show="$store.dwa.error" x-text="$store.dwa.error" role="alert"
     class="sticky top-2 z-10 mb-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800 outline outline-1 outline-red-200"></p>

  <div class="mb-4 flex flex-wrap items-center justify-between gap-3" x-cloak x-show="$store.dwa.ready">
    <div class="flex gap-1 rounded-full bg-white p-1 text-sm shadow-sm" role="tablist" aria-label="Filter rows">
      <template x-for="f in filters" :key="f.key">
        <button type="button" role="tab" :aria-selected="filter === f.key" @click="filter = f.key"
                class="rounded-full px-3 py-1 aria-selected:bg-[var(--ink)] aria-selected:text-white">
          <span x-text="f.label"></span> <span class="opacity-60" x-text="count(f.key)"></span>
        </button>
      </template>
    </div>
    <p class="text-sm text-stone-600"><strong x-text="rows.length - count('todo')"></strong> of <span x-text="rows.length"></span> reviewed
      <span x-show="$store.dwa.me">· as <strong x-text="$store.dwa.me"></strong>
        <button type="button" class="underline decoration-stone-300 underline-offset-2" @click="$store.dwa.rename()">change</button></span></p>
  </div>

  <p x-show="!loaded" class="text-stone-500">Loading…</p>

  <ul class="space-y-3" x-cloak x-show="loaded">
    <template x-for="r in visible" :key="r.id">
      <li class="card grid gap-3 p-4 sm:grid-cols-[1fr_auto] sm:p-5">
        <div>
          <p class="text-xs text-stone-500"><span x-text="r.date"></span> · <span class="font-mono" x-text="money(r.amount)"></span></p>
          <p class="mt-0.5 font-medium" x-text="r.description"></p>
          <p class="mt-1 text-sm text-stone-600" x-show="r.suggestion">Suggested: <span x-text="r.suggestion"></span></p>
        </div>
        <fieldset class="flex flex-wrap items-start gap-1.5 sm:justify-end" :disabled="$store.dwa.closed">
          <legend class="sr-only" x-text="'Decision for ' + r.description"></legend>
          <template x-for="s in statuses" :key="s.key">
            <button type="button" @click="$store.dwa.save(key(r, 'status'), $store.dwa.val(key(r, 'status')) === s.key ? null : s.key)"
                    :aria-pressed="$store.dwa.val(key(r, 'status')) === s.key"
                    class="rounded-full px-3 py-1 text-sm outline outline-1 outline-stone-200 hover:bg-stone-50 disabled:opacity-50"
                    :class="$store.dwa.val(key(r, 'status')) === s.key && s.on" x-text="s.label"></button>
          </template>
        </fieldset>
        <div class="sm:col-span-2">
          <input type="text" placeholder="Note (optional)" :aria-label="'Note for ' + r.description"
                 x-data="dwaText(key(r, 'note'))" x-model="draft" x-bind="field"
                 class="w-full rounded-lg px-3 py-1.5 text-sm outline outline-1 outline-stone-200 focus:outline-2 focus:outline-[var(--terracotta)] disabled:bg-stone-50">
          <p class="mt-1 text-xs text-stone-500" x-show="$store.dwa.has(key(r, 'status'))"
             x-text="'Marked by ' + $store.dwa.by(key(r, 'status')) + ', ' + $store.dwa.ago(key(r, 'status'))"></p>
        </div>
      </li>
    </template>
  </ul>
</main>

<script>
document.addEventListener("alpine:init", () => {
  Alpine.data("review", () => ({
    rows: [], loaded: false, filter: "all",
    statuses: [
      { key: "ok", label: "Approve", on: "!bg-emerald-50 !outline-2 !outline-[var(--emerald)]" },
      { key: "query", label: "Query", on: "!bg-amber-50 !outline-2 !outline-[var(--mustard-dark)]" },
      { key: "change", label: "Change", on: "!bg-orange-50 !outline-2 !outline-[var(--terracotta)]" },
    ],
    filters: [
      { key: "all", label: "All" }, { key: "todo", label: "To review" },
      { key: "query", label: "Queried" }, { key: "change", label: "To change" },
    ],
    // Rows ship as data.json beside this page; ids must be stable and match [A-Za-z0-9_.:/-].
    async init() { this.rows = await (await fetch("data.json")).json(); this.loaded = true; },
    key(r, field) { return `row.${r.id}.${field}`; },
    status(r) { return this.$store.dwa.val(this.key(r, "status")) || "todo"; },
    count(f) { return f === "all" ? this.rows.length : this.rows.filter((r) => this.status(r) === f).length; },
    get visible() { return this.filter === "all" ? this.rows : this.rows.filter((r) => this.status(r) === this.filter); },
    money(n) { return new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP" }).format(n); },
  }));
});
</script>
</body>
</html>
